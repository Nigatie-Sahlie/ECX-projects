services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: daycareapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daycareapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend/DaycareApi
      dockerfile: Dockerfile
    image: daycare-api
    ports:
      - "5000:5000"
    command: ["--urls", "http://0.0.0.0:5000"]
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=daycareapp;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-daycareapp}
      Jwt__Hours: ${JWT_HOURS:-8}
      Cors__Origin: ${APP_ORIGIN:-http://localhost:5173}
      Frontend__ResetPasswordUrl: ${RESET_PASSWORD_URL:-http://localhost:5173/reset-password}
      Smtp__Enabled: ${SMTP_ENABLED:-true}
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__UseSsl: ${SMTP_USE_SSL:-false}
      Smtp__From: ${SMTP_FROM:-no-reply@daycareapp.local}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
    name: daycareapp_docker_postgres_data
