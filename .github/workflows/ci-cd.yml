name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  API_REPOSITORY: daycare-api
  MIGRATIONS_REPOSITORY: daycare-api-migrations
  FRONTEND_REPOSITORY: daycare-frontend

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: daycare_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d daycare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DAYCARE_TEST_CONNECTION: "Host=localhost;Port=5432;Database=daycare_test;Username=postgres;Password=postgres"
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=daycare_test;Username=postgres;Password=postgres"
      Cors__Origin: "http://localhost:5173"
      Jwt__Key: "ci-test-key-at-least-32-characters-long-123456"
      Jwt__Issuer: "daycareapp"
      Jwt__Hours: "8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Set up .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.x

      - name: Restore backend
        run: dotnet restore daycareapp/backend/DaycareApi.Tests/DaycareApi.Tests.csproj

      - name: Test backend
        run: dotnet test daycareapp/backend/DaycareApi.Tests/DaycareApi.Tests.csproj --configuration Release --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: daycareapp/frontend/package-lock.json

      - name: Build frontend
        working-directory: daycareapp/frontend
        run: |
          npm ci
          npm run build

  publish:
    name: Publish images to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: daycareapp/backend/DaycareApi
          file: daycareapp/backend/DaycareApi/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.API_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrations image
        uses: docker/build-push-action@v6
        with:
          context: daycareapp/backend/DaycareApi
          file: daycareapp/backend/DaycareApi/Dockerfile.migrations
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.MIGRATIONS_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.MIGRATIONS_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: daycareapp/frontend
          file: daycareapp/frontend/Dockerfile
          build-args: VITE_API_URL=
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  deploy:
    name: Deploy to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: i-0ee89b2d30a33c4e5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Deploy through SSM
        run: |
          PARAMS=$(jq -n --arg reg "$ECR_REGISTRY" --arg tag "$GITHUB_SHA" '{commands: [
            "set -e",
            "export PATH=$PATH:/snap/bin",
            "cd /home/ubuntu/ECX-projects/daycareapp",
            "sudo -u ubuntu git pull --ff-only",
            "aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin \($reg)",
            "export IMAGE_TAG=\($tag)",
            "docker compose -f docker-compose.prod.yml --env-file .env.production pull",
            "docker compose -f docker-compose.prod.yml --env-file .env.production up -d",
            "docker image prune -f"
          ]}')
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "Deploy $GITHUB_SHA" \
            --parameters "$PARAMS" --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || FAILED=1
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          [ -z "$FAILED" ]
